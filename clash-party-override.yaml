# 自动生成：由 scripts/build.mjs 生成，请勿手动编辑。
# Bind this URL in Clash Party to load these rule providers and rules.
proxy-groups:
  - name: "⚡ 自动选择"
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    include-all: true
  - name: "🤖 AI"
    type: fallback
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    include-all: true
    filter: "(?i)(?:JP|JPN|Japan|日本|Tokyo|東京|Osaka|大阪|🇯🇵)"
    empty-fallback: "REJECT"
  - name: "🌐 国内"
    type: select
    proxies:
      - "⚡ 自动选择"
      - "DIRECT"
  - name: "🐟 漏网之鱼"
    type: select
    proxies:
      - "⚡ 自动选择"
      - "DIRECT"
rule-providers!:
  lan_non_ip:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    path: ./rules/lan_non_ip.yaml
    url: "https://raw.githubusercontent.com/yuanv4/clash-rules/release/rules/lan_non_ip.yaml"
    proxy: "⚡ 自动选择"
  lan_ip:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    path: ./rules/lan_ip.yaml
    url: "https://raw.githubusercontent.com/yuanv4/clash-rules/release/rules/lan_ip.yaml"
    proxy: "⚡ 自动选择"
  reject_non_ip:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    path: ./rules/reject_non_ip.yaml
    url: "https://raw.githubusercontent.com/yuanv4/clash-rules/release/rules/reject_non_ip.yaml"
    proxy: "⚡ 自动选择"
  reject_ip:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    path: ./rules/reject_ip.yaml
    url: "https://raw.githubusercontent.com/yuanv4/clash-rules/release/rules/reject_ip.yaml"
    proxy: "⚡ 自动选择"
  ai:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    path: ./rules/ai.yaml
    url: "https://raw.githubusercontent.com/yuanv4/clash-rules/release/rules/ai.yaml"
    proxy: "⚡ 自动选择"
  direct:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    path: ./rules/direct.yaml
    url: "https://raw.githubusercontent.com/yuanv4/clash-rules/release/rules/direct.yaml"
    proxy: "⚡ 自动选择"
  foreign:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    path: ./rules/foreign.yaml
    url: "https://raw.githubusercontent.com/yuanv4/clash-rules/release/rules/foreign.yaml"
    proxy: "⚡ 自动选择"
rules:
  - RULE-SET,lan_non_ip,DIRECT,no-resolve
  - RULE-SET,lan_ip,DIRECT,no-resolve
  - RULE-SET,reject_non_ip,REJECT,no-resolve
  - RULE-SET,reject_ip,REJECT,no-resolve
  - RULE-SET,ai,🤖 AI,no-resolve
  - RULE-SET,direct,🌐 国内,no-resolve
  - RULE-SET,foreign,⚡ 自动选择
  - MATCH,🐟 漏网之鱼
