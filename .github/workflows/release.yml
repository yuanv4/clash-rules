name: Build And Publish Rule Providers

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/release.yml"
      - "scripts/**"
      - "sources.json"
      - "package.json"
      - "package-lock.json"
      - "custom/**"
  schedule:
    - cron: "30 22 * * *"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-release
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Test rule pipeline
        run: npm test

      - name: Build rule providers and scripts
        run: npm run build

      - name: Sync release branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release
          release_worktree="${RUNNER_TEMP}/clash-rules-release"
          git worktree add --detach "$release_worktree" origin/release
          trap 'git worktree remove --force "$release_worktree"' EXIT

          git -C "$release_worktree" rm -r -- .
          mkdir -p "$release_worktree/rules" "$release_worktree/custom" "$release_worktree/scripts"
          shopt -s nullglob
          provider_files=(dist/rules/*.yaml dist/rules/*.txt)
          if [[ "${#provider_files[@]}" -eq 0 ]]; then
            echo "No rule provider artifacts found." >&2
            exit 1
          fi
          custom_files=(custom/*.txt)
          if [[ "${#custom_files[@]}" -eq 0 ]]; then
            echo "No custom source files found." >&2
            exit 1
          fi
          script_files=(dist/scripts/flclash.js dist/scripts/flclash-desktop.js dist/scripts/flclash-android.js dist/scripts/flclash-both.js)
          for script_file in "${script_files[@]}"; do test -f "$script_file"; done
          cp -- "${script_files[@]}" "$release_worktree/scripts/"
          cp -- "${provider_files[@]}" "$release_worktree/rules/"
          cp -- "${custom_files[@]}" "$release_worktree/custom/"

          legacy_count=0
          for legacy_provider in dev_services openai; do
            legacy_file="rules/${legacy_provider}.yaml"
            if [[ ! -f "$release_worktree/$legacy_file" ]] && git -C "$release_worktree" cat-file -e "HEAD:$legacy_file" 2>/dev/null; then
              git -C "$release_worktree" restore --source=HEAD --worktree -- "$legacy_file"
              legacy_count=$((legacy_count + 1))
            fi
          done

          git -C "$release_worktree" add -A
          mapfile -d '' -t tracked_files < <(git -C "$release_worktree" ls-files --cached -z)
          provider_count=${#provider_files[@]}
          custom_count=${#custom_files[@]}
          expected_count=$((provider_count + custom_count + legacy_count + ${#script_files[@]}))
          if [[ "${#tracked_files[@]}" -ne $expected_count ]]; then
            echo "Expected exactly ${expected_count} tracked publication artifacts, found ${#tracked_files[@]}." >&2
            exit 1
          fi
          for tracked_file in "${tracked_files[@]}"; do
            case "$tracked_file" in
              rules/*.yaml|rules/*.txt) ;;
              custom/*.txt) ;;
              scripts/flclash.js|scripts/flclash-desktop.js|scripts/flclash-android.js|scripts/flclash-both.js) ;;
              *)
                echo "Unexpected tracked release artifact: $tracked_file" >&2
                exit 1
                ;;
            esac
          done

          if git -C "$release_worktree" diff --cached --quiet; then
            echo "No artifact changes to publish."
            exit 0
          fi

          git -C "$release_worktree" config user.name "github-actions[bot]"
          git -C "$release_worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$release_worktree" commit -m "Publish rule providers for run ${{ github.run_number }}"
          git -C "$release_worktree" push origin HEAD:release
