name: Deploy Clash Profile Worker

# 手动部署 worker/clash-profile.js。
# 只有在 Worker 源码或绑定变化时才需要跑；日常 profile 更新由
# Deploy FlClash Profile 负责，不会碰 Worker。
#
# 顺序要求：先部署 Worker，再发布带占位符的 profile。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check required secrets
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_SECRET_PATH: ${{ secrets.CF_SECRET_PATH }}
        run: |
          set -euo pipefail
          missing=0
          for name in CF_API_TOKEN CF_ACCOUNT_ID CF_KV_NAMESPACE_ID CF_SECRET_PATH; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Deploy worker
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_SECRET_PATH: ${{ secrets.CF_SECRET_PATH }}
          CF_TS_INTERFACE: ${{ secrets.CF_TS_INTERFACE }}
          CF_TS_AUTH_KEY: ${{ secrets.CF_TS_AUTH_KEY }}
        run: node scripts/deploy-clash-worker.mjs
