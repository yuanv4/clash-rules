name: Deploy FlClash Profile

# 生成 FlClash 自定义配置并推送到 Cloudflare Workers KV。
# 与 release.yml 相互独立：这里只碰 KV，不动 release 分支。

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/deploy-profile.yml"
      - "scripts/render-flclash-profile.mjs"
      - "scripts/publish-flclash-profile.mjs"
      - "scripts/*.test.mjs"
      - "sources.json"
  schedule:
    # 每天 02:17 UTC（北京时间 10:17）
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-profile
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Test configuration pipeline
        run: bun test scripts/

      - name: Check required secrets
        env:
          SUBSCRIPTIONS_JSON: ${{ secrets.SUBSCRIPTIONS_JSON }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in SUBSCRIPTIONS_JSON CF_API_TOKEN CF_ACCOUNT_ID CF_KV_NAMESPACE_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Render profile
        env:
          SUBSCRIPTIONS_JSON: ${{ secrets.SUBSCRIPTIONS_JSON }}
        run: bun scripts/render-flclash-profile.mjs --output "$RUNNER_TEMP/profile.yaml"

      - name: Publish to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: node scripts/publish-flclash-profile.mjs "$RUNNER_TEMP/profile.yaml"
