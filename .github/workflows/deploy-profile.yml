name: Deploy FlClash Profile

# 生成 FlClash 自定义配置并推送到 Cloudflare Workers KV。
# 规则发布成功后再发布模板；发布前核对公开规则来源。

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build And Publish Rule Providers"]
    types: [completed]
    branches: [main, master]
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/deploy-profile.yml"
      - "scripts/publish-flclash-profile.mjs"
      - "scripts/verify-published-rules.mjs"
  schedule:
    # 每天 02:17 UTC（北京时间 10:17）
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-profile
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Test configuration pipeline
        run: npm test

      - name: Verify published rule providers
        run: node scripts/verify-published-rules.mjs

      - name: Check required secrets
        env:
          SUBSCRIPTIONS_JSON: ${{ secrets.SUBSCRIPTIONS_JSON }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in SUBSCRIPTIONS_JSON CF_API_TOKEN CF_ACCOUNT_ID CF_KV_NAMESPACE_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Render profile
        env:
          SUBSCRIPTIONS_JSON: ${{ secrets.SUBSCRIPTIONS_JSON }}
        run: node scripts/render-flclash-profile.mjs --output "$RUNNER_TEMP/profile.yaml"

      - name: Publish to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: node scripts/publish-flclash-profile.mjs "$RUNNER_TEMP/profile.yaml"
